[project]
name = "airlock-mcp"
version = "0.2.0"
description = "Airlock: Firewall for AI agents using MCP tools"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
    "pyahocorasick>=2.1",
    # Streamable HTTP proxy (`airlock serve`); the same stack the mcp SDK uses.
    "httpx2>=2.16",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
airlock = "airlock.cli:app"

[project.optional-dependencies]
classifier = [
    "optimum[onnxruntime]>=1.24.0",
    "transformers>=4.45.0",
]
bench = [
    "agentdojo>=0.1.31",
]
slack = [
    "slack-sdk>=3.33",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "airlock/_packs"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["airlock"]

[[tool.mypy.overrides]]
# pyahocorasick is a C extension and ships no type stubs.
module = "ahocorasick"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional extras (slack, otel): may not be installed where mypy runs.
module = ["slack_sdk.*", "opentelemetry.sdk.*", "opentelemetry.exporter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.fixtures.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
